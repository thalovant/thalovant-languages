# What a slot becomes when a registered pattern is read aloud: "volume
# {level} percent" has to be sayable. Plausible, and never a fact about the
# estate. A slot with no example keeps its own name, which reads worse but
# invents nothing.
slot_examples:
  incident: the last one
  level: fifty
  location: Toronto
  query: the garage door
  topic: power

# The sign of a negative number. The voices' text front end (phoonnx, then
# espeak-ng) drops it before a unit: "-3°C" is said "3 degrees Celsius". The
# sign is written as "minus", the word espeak-ng says for a plain "-3". A
# hyphen after a letter, a digit or a unit is left alone: "3-5",
# "2025-09-27", "06-12-34-56-78" and hyphenated words.
speech_substitutions:
  - pattern: '(?<![\w°%)\]−-])[−-](?=\d)'
    replace: 'minus '
    why: the voices drop a negative number's sign before a unit
