# « a » sans accent est « à » : la skill météo écrit son français sans
# accents (« quelles sont les conditions actuelles a »), et pour les corpus
# « a » est le verbe avoir, qui termine une phrase. Ajouté aux mots de fin
# de préfixe pour que la liste ne ponctue pas une moitié de phrase.
+trailing_words:
  - a

# Inversion sujet-verbe, et « est-ce que » : ce qu'aucun corpus ne donne
# sous forme de liste. Expressions régulières, sans tenir compte de la
# casse. La skill météo écrit son français sans accents ni traits d'union
# (« y a t il de la neige », « ai je besoin d une veste »), donc les formes
# espacées comptent autant que les formes avec trait d'union. « -vous » et
# « -nous » sont précédés d'un lookbehind : « rendez-vous » est un nom.
question_patterns:
  - "\\bqu'est[- ]ce\\b"
  - '\best[- ]ce\b'
  - '(?<!rendez)-(?:t-)?(?:il|elle|on|ils|elles|tu|je|vous|nous)\b'
  - '\bt (?:il|elle|on)\b'
  - '\bai je\b'

# Ce que devient un slot quand un motif enregistré est lu à voix haute.
# Plausible, jamais un fait sur la maison.
slot_examples:
  incident: le dernier
  level: cinquante
  location: Toronto
  query: la porte du garage
  topic: l'électricité

# Corrections de prononciation. Chaque voix Piper française (siwis, upmc,
# tom, gilles) avale la dernière consonne d'une heure devant « à » :
# « quinze heures onze à Montréal » sort « on », « douze à » sort « doux ».
# La faute est au modèle acoustique : espeak-ng émet bien le /z/, une
# virgule fond les deux, et length_scale jusqu'à 1,6 ou noise_w_scale
# jusqu'à 0,4 ne changent rien. facebook/mms-tts-fra dit les deux
# correctement et a été écarté sur les chiffres : 2,3 à 2,6 fois le temps
# réel sur l'Orin contre 8,6 à 11,6 pour Piper, et 16 kHz contre 22,05 kHz.
# Seulement là où le sens est identique : « quinze heures onze minutes »
# dit ce que dit « quinze heures onze ». Le motif épelle les nombres parce
# que « quinze heures et demie à » et « deux heures environ à » ne sont pas
# des heures avec des minutes.
speech_substitutions:
  - pattern: >-
      (\bheures?\s+)(une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|treize|quatorze|quinze|seize|dix-sept|dix-huit|dix-neuf|vingt|trente|quarante|cinquante|vingt-et-une|vingt-deux|vingt-trois|vingt-quatre|vingt-cinq|vingt-six|vingt-sept|vingt-huit|vingt-neuf|trente-et-une|quarante-cinq)(\s+à\b)
    replace: '\1\2 minutes\3'
    why: the fr acoustic model drops the number's last consonant before 'à'
