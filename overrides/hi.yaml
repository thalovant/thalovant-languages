# The sign of a negative number. The voices' text front end (phoonnx, then
# espeak-ng) drops it before a unit: "-3°C" is said "3 degrees Celsius". It
# also reads the Unicode minus "−" as the English word "minus". The sign is
# written as "ऋण", the word espeak-ng says for a plain "-3". A hyphen after
# a letter, a digit or a unit is left alone: "3-5", "2025-09-27",
# "06-12-34-56-78" and hyphenated words. A word's last letter is often a
# vowel sign, a combining mark Python's \w does not match, so every
# Devanagari character counts as a letter here: "कक्षा-3" is left alone.
speech_substitutions:
  - pattern: '(?<![\w\u0900-\u0963\u0966-\u097F°%)\]−-])[−-](?=\d)'
    replace: 'ऋण '
    why: the voices drop a negative number's sign before a unit
