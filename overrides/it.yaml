# The sign of a negative number. The voices' text front end (phoonnx, then
# espeak-ng) drops it before a unit: "-3°C" is said "3 degrees Celsius". The
# sign is written as "meno", the word espeak-ng says for a plain "-3". A
# hyphen after a letter, a digit or a unit is left alone: "3-5",
# "2025-09-27", "06-12-34-56-78" and hyphenated words.
speech_substitutions:
  - pattern: '(?<![\w°%)\]−-])[−-](?=\d)'
    replace: 'meno '
    why: the voices drop a negative number's sign before a unit
  # The English loanword the apps use for the person's hub. The voices read
  # "hub" as "ub"; people say "ab", as in "l'hub". Only the word itself and
  # its endings: a longer word that starts the same way is left alone.
  - pattern: '\bhub\b'
    replace: 'ab'
    why: the voices mispronounce the loanword hub
