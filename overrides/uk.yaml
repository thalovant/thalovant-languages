# The sign of a negative number. The voices' text front end (phoonnx, then
# espeak-ng) drops it before a unit: "-3°C" is said "3 degrees Celsius". It
# also reads the Unicode minus "−" as the English word "minus". The sign is
# written as "мінус", the word espeak-ng says for a plain "-3", with its
# stress marked (see below). A hyphen after a letter, a digit or a unit is
# left alone: "3-5", "2025-09-27", "06-12-34-56-78" and hyphenated words.
speech_substitutions:
  - pattern: '(?<![\w°%)\]−-])[−-](?=\d)'
    replace: 'мі́нус '
    why: the voices drop a negative number's sign before a unit
  # Stress. The Ukrainian voice (uk_UA-ukrainian_tts-medium) reads letters,
  # not espeak-ng's phonemes, and its alphabet has the combining acute
  # (U+0301): written after a vowel, it is that vowel's stress. Unmarked, the
  # voice guesses. Said in "я кажу ... знову", its duration predictor
  # stretched the stressed vowel of 33 of the 104 words below unmarked and of
  # 98 marked. espeak-ng 1.52 ignores the mark, so an espeak voice hears no
  # change. The stresses are the ukrainian-word-stress dictionary's (lang-uk,
  # MIT, dictionary-only mode) unless the why says otherwise. A pattern
  # captures the first letter, so a capital stays one, and will not end on a
  # combining mark, so a word already stressed is left alone. A word whose
  # stress depends on its sense is written as the phrase the satellite says
  # (нічого не, розібрати слова, Пора.) or left out: за́пити/запи́ти,
  # п'я́та/п'ята́, сьома, сьому, п'яти, тепло, опади. Only words reach the
  # rules: phoonnx spells a number written in digits out after them.
  - pattern: '\b(н)ічого(?=\s+не\b)'
    replace: '\1ічо́го'
    why: 'нічо́го, nothing, before a verb''s не; ні́чого is there is no need to'
  - pattern: '\b(р)озібрати(\s+)(с)лова\b'
    replace: '\1озібра́ти\2\3лова́'
    why: 'розібрати слова́, make out the words; сло́ва is of the word'
  - pattern: '^\s*(п)ора(?=\s*[.!…]*\s*$)'
    replace: '\1ора́'
    why: 'the alarm''s Пора́, it is time; по́ра is a season, or a pore'
  - pattern: '(?<![\w\u0300-\u036f])(в)далося(?![\w\u0300-\u036f])'
    replace: '\1дало́ся'
    why: 'вдало́ся: unmarked, the voice said вда́лося'
  - pattern: '(?<![\w\u0300-\u036f])(р)озчути(?![\w\u0300-\u036f])'
