# What the fleet knows about German without a word of it being read or heard
# by anybody. Only the rules a component has needed so far; a language file
# grows a key at a time. A directory named by the bare language tag serves
# every region of it (de-DE, de-AT, de-CH).
#
# A partial transcript ending on one of these is mid-thought, however stable
# it looks, and the semantic endpoint waits rather than firing mid-command.
