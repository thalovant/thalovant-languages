# What the fleet knows about English that is not a sentence anybody reads or
# hears: the words a rule turns on. Each of these used to be a Python
# constant in whichever component needed it first. A language is data, so it
# lives here, and a new language is a directory, not an edit to a program.
#
# Every key is optional. A language that states none of them gets no rule at
# all -- never English's. The keys a component reads are `thalovant_languages.KEYS`,
# and `thalovant-languages check` refuses a file that names any other.

# A partial transcript ending on one of these is mid-thought, however stable
# it looks: "turn off the" is not a request yet, and a semantic endpoint
# waits. Generous on purpose: a false hold costs one frame, a false fire
# costs the whole interaction plus a repeat.
continuation_words:
  - and
  - or
  - the
  - a
  - an
  - to
  - of
  - in
  - "on"  # quoted: bare, YAML reads it as a boolean
  - at
  - by
  - for
  - with
  - but
  - my
  - is
  - are
  - was

# A registered phrase ending on one of these is a keyword prefix waiting for
# an entity ("weather in"), not something anybody says on its own. A listing
# ranks it after whole sentences and leaves it unpunctuated: there is no
# honest mark for half a sentence.
trailing_words:
  - in
  - for
  - at
  - to
  - "on"  # quoted: bare, YAML reads it as a boolean
  - of
  - with
  - about
  - from
  - into
  - the
  - a
  - an
  - my
  - is
  - was

# A phrase opening with one of these is a question, and is closed with a
# question mark rather than a full stop.
question_openers:
  - what
  - when
  - where
  - who
  - whom
  - whose
  - why
  - how
  - which
  - is
  - are
  - am
  - was
  - were
  - do
  - does
  - did
  - can
  - could
  - will
  - would
  - should
  - shall
  - may
  - might
  - has
  - have
  - had

# Locale files are lower case throughout, so the first person arrives as
# "do i need a jacket". Set as a sentence, a word listed here is written the
# way it is written; the lone letter was the one thing left in the line that
# still looked like a typing mistake.
written_forms:
  i: I

# Which counts take which form of a counted string. A count listed under no
# category takes "other".
plural:
  one: [1]

# What a slot becomes when a registered pattern is read aloud: "volume
# {level} percent" has to be sayable. Plausible, and never a fact about the
# estate. A slot with no example keeps its own name, which reads worse but
# invents nothing.
slot_examples:
  incident: the last one
  level: fifty
  location: Toronto
  query: the garage door
  topic: power
