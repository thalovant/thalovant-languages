# Ce que la flotte sait du français sans qu'aucune phrase n'y soit lue ni
# entendue : les mots sur lesquels une règle se déclenche. Chaque clé est
# facultative ; une langue qui n'en donne aucune n'a aucune règle -- jamais
# celles de l'anglais. Les clés lues par un composant sont dans
# `thalovant_languages.KEYS`, et `thalovant-languages check` refuse un
# fichier qui en nomme une autre.

# Une transcription partielle qui finit sur l'un de ces mots est encore en
# cours : « allume la » n'est pas une demande. Le point de fin sémantique
# attend.
continuation_words:
  - le
  - la
  - les
  - un
  - une
  - des
  - du
  - de
  - au
  - aux
  - ce
  - cet
  - cette
  - ces
  - mon
  - ma
  - mes
  - et
  - ou
  - dans
  - sur
  - pour
  - avec
  - est
  - sont
  - qui
  - que
  - quel
  - quelle
  - mais

# Une phrase enregistrée qui finit sur l'un de ces mots est un préfixe de
# mot-clé en attente d'une entité (« quelles sont les conditions actuelles
# a »), pas une phrase qu'on dit. La liste la classe après les phrases
# entières et ne la ponctue pas. « a » sans accent : la skill météo écrit
# son français sans accents.
trailing_words:
  - à
  - a
  - de
  - du
  - des
  - au
  - aux
  - en
  - dans
  - pour
  - sur
  - avec
  - chez
  - vers
  - par
  - le
  - la
  - les
  - un
  - une
  - mon
  - ma
  - mes

# Une phrase qui s'ouvre sur l'un de ces mots est une question.
question_openers:
  - quel
  - quelle
  - quels
  - quelles
  - lequel
  - laquelle
  - que
  - quoi
  - qui
  - quand
  - où
  - comment
  - combien
  - pourquoi

# Une question où que ces mots se trouvent, pas seulement en tête. À l'oral
# on demande « il est quelle heure » et « on est quel mois » sans inversion
# et sans interrogatif devant ; un « quel » au milieu est la seule chose qui
# distingue ces phrases d'une affirmation. Volontairement étroit : « que » et
# « qui » sont bien plus souvent relatifs qu'interrogatifs (« oublie ce que
# j'ai dit » est un ordre).
question_words_anywhere:
  - quel
  - quelle
  - quels
  - quelles
  - combien

# Inversion sujet-verbe, et « est-ce que ». Expressions régulières, sans
# tenir compte de la casse. La skill météo écrit son français sans accents
# ni traits d'union (« y a t il de la neige », « ai je besoin d une veste »),
# donc les formes espacées comptent autant que les formes avec trait d'union.
# « -vous » et « -nous » sont précédés d'un lookbehind : « rendez-vous » est
# un nom, et sans lui toute phrase qui en prend un serait une question.
question_patterns:
  - "\\bqu'est[- ]ce\\b"
  - '\best[- ]ce\b'
  - '(?<!rendez)-(?:t-)?(?:il|elle|on|ils|elles|tu|je|vous|nous)\b'
  - '\bt (?:il|elle|on)\b'
  - '\bai je\b'

# Le français compte zéro au singulier (« 0 chose à demander »), ce que la
# règle anglaise aurait faux sur chaque liste vide.
plural:
  one: [0, 1]

# Ce que devient un slot quand un motif enregistré est lu à voix haute.
# Plausible, jamais un fait sur la maison.
slot_examples:
  incident: le dernier
  level: cinquante
  location: Toronto
  query: la porte du garage
  topic: l'électricité

# Corrections de prononciation. Chaque voix Piper française (siwis, upmc,
# tom, gilles) avale la dernière consonne d'une heure devant « à » :
# « quinze heures onze à Montréal » sort « on », « douze à » sort « doux ».
# La faute est au modèle acoustique : espeak-ng émet bien le /z/ (« il ɛ
# kˈɛ̃z ˈœʁ ˈɔ̃z a mɔ̃ʁeˈal », chaque symbole est dans phoneme_id_map), une
# virgule fond les deux en « ˈɔ̃za », et length_scale jusqu'à 1,6 ou
# noise_w_scale jusqu'à 0,4 ne changent rien. facebook/mms-tts-fra dit les
# deux correctement et a été écarté sur les chiffres : 2,3 à 2,6 fois le
# temps réel sur l'Orin contre 8,6 à 11,6 pour Piper, et 16 kHz contre
# 22,05 kHz.
#
# Seulement là où le sens est identique : « quinze heures onze minutes »
# dit ce que dit « quinze heures onze ». Le motif épelle les nombres parce
# que « quinze heures et demie à » et « deux heures environ à » ne sont pas
# des heures avec des minutes. Une nouvelle voix ou un nouveau défaut est
# une ligne ici, ou dans la configuration du composant qui parle.
speech_substitutions:
  - pattern: >-
      (\bheures?\s+)(une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|treize|quatorze|quinze|seize|dix-sept|dix-huit|dix-neuf|vingt|trente|quarante|cinquante|vingt-et-une|vingt-deux|vingt-trois|vingt-quatre|vingt-cinq|vingt-six|vingt-sept|vingt-huit|vingt-neuf|trente-et-une|quarante-cinq)(\s+à\b)
    replace: '\1\2 minutes\3'
    why: the fr acoustic model drops the number's last consonant before 'à'
